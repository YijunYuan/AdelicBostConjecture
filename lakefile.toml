name = "adelicBostConjecture"
version = "0.1.0"
defaultTargets = ["AdelicBostConjecture"]
weakLeanArgs = ["-j2"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "HarderNarasimhan"
git = "https://github.com/YijunYuan/HarderNarasimhan.git"
rev = "14b3090e1e169b77fe381102a1289f24c2b08a11"

[[lean_lib]]
name = "AdelicBostConjecture"

[[require]]
name = "ArakelovGeometry"
git = "https://github.com/YijunYuan/ArakelovGeometry.git"
rev = "c5bc84472182eac62bea952d975b5db305f615d4"
